[project]
name = "docgen"
version = "1.0.9"
description = "Streamlined document generation"
readme = "README.md"
authors = [
    { name = "Camden White", email = "camdenrenn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mypy>=2.3.1",
]

[project.scripts]
docgen = "docgen.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]

[tool.pyright]
useLibraryCodeForTypes = true
