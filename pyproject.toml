[project]
name = "docgen"
version = "1.1.2"
description = "Streamlined document generation"
readme = "README.md"
authors = [
    { name = "Camden White", email = "camdenrenn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
docgen = "docgen.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.pyright]
useLibraryCodeForTypes = true
