name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build DocGen
        run: >
          uv run pyinstaller
          --name DocGen
          --windowed
          --onefile
          --add-data "src/docgen/templates:docgen/templates"
          --collect-submodules docgen.documents
          src/docgen/main.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release

          Copy-Item `
            dist/DocGen.exe `
            release/DocGen.exe

          Copy-Item `
            src/docgen/examples/config.example.toml `
            release/config.toml

          Copy-Item `
            src/docgen/examples/logo.example.png `
            release/logo.png

          Compress-Archive `
            -Path release/* `
            -DestinationPath "DocGen-${{ github.ref_name }}-Windows.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "DocGen-${{ github.ref_name }}-Windows.zip" `
            --verify-tag `
            --generate-notes `
            --title "DocGen ${{ github.ref_name }}"
