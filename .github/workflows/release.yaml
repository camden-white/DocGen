name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  build:
    name: Build ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python with Tk support
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install the locked environment with the selected interpreter
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --locked --no-python-downloads
      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked python scripts/release.py verify-tag "$RELEASE_TAG"
      - name: Platform unit and GUI tests
        env:
          DOCGEN_RUN_GUI: "1"
        run: uv run --locked pytest -m "not integration"
      - name: Verify clean wheel installation and Tk
        run: uv run --locked python scripts/check_package.py --gui
      - name: Build application
        run: uv run --locked python scripts/build_app.py
      - name: Smoke-test the frozen application
        run: >-
          uv run --locked python -c
          "import subprocess; from scripts.build_app import app_path;
          subprocess.run([str(app_path()), '--smoke-test'], check=True, timeout=60)"
      - name: Archive and audit release
        run: |
          uv run --locked python scripts/build_app.py --archive
          uv run --locked python scripts/check_artifacts.py release/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DocGen-${{ matrix.os }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish both platform builds
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: DocGen-*
          path: release
          merge-multiple: true
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          artifacts=(release/*.zip)
          if [ "${#artifacts[@]}" -ne 2 ]; then
            echo "Expected exactly two validated platform archives."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${artifacts[@]}" \
            --verify-tag --generate-notes --title "DocGen $RELEASE_TAG"
